## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Wed Jun 05 21:02:13 CEST 2024
# AGP 9: resValues and shaders now default to off, so those two flags were dropped.
# AGP 9 also turns on built-in Kotlin and the new DSL; the build logic is migrated to both.
#
# Keep R8 behaving exactly as on AGP 8 for release builds (minify + shrinkResources). AGP 9's
# stricter keep-rule handling can strip classes used only via reflection (Gson models, Koin),
# which only shows up as release crashes. Remove these once release is verified with them on.
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
org.gradle.jvmargs=-Xmx6144M -Dkotlin.daemon.jvm.options\="-Xmx6144M" -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
