name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-style:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless (ktlint) check
        run: ./gradlew spotlessCheck

  design-system:
    # Phase 5 of the design system plan: features may only use Em* components and tokens
    # (lint errors), and component screenshots must match the committed images.
    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Design system lint checks (unit tests)
        run: ./gradlew :lint-rules:test

      - name: Android lint (design system rules are errors)
        run: ./gradlew lintDebug

      - name: Verify component screenshots
        run: ./gradlew :core:designsystem:testDebugUnitTest -Proborazzi.test.verify=true

      - name: Upload lint and screenshot reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-system-reports
          path: |
            **/build/reports/lint-results-*.html
            core/designsystem/build/outputs/roborazzi/
            core/designsystem/src/test/screenshots/*_compare.png

  bundle-release:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release bundle
        run: ./gradlew --no-configuration-cache bundleRelease

  unit-test:
    runs-on: ubuntu-latest

    # The Jacoco action comments coverage on pull requests.
    permissions:
      contents: read
      pull-requests: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests with module coverage
        run: ./gradlew debugCoverage

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

      - name: Jacoco Report
        id: jacoco
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/**/debugCoverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
