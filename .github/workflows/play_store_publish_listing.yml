name: Play Store - Publish Store Listing

# Uploads the store listing text (title, short and full description) in every language under
# app/src/main/play/listings/ using Gradle Play Publisher. It does not upload a build or change
# any release track.
on:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/play/listings/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-listing:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Play credentials
        env:
          PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$PLAY_KEY" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 secret is not set"
            exit 1
          fi
          echo "$PLAY_KEY" | base64 -d > ./play_publish.json

      # Release variant only: the debug variant has a ".debug" application id that isn't on Play.
      - name: Publish store listing
        run: ./gradlew --no-configuration-cache publishReleaseListing

      - name: Remove credentials
        if: always()
        run: rm -f ./play_publish.json
