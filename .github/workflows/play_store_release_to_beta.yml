name: Play Store - Release to Beta

# Bumps the version (version.properties), uploads the bundle to the beta track, and only after a
# successful upload commits the new version and creates the release tag. A failed upload leaves
# the repository untouched, so the next run bumps from the same version again.
on:
  workflow_call:
    inputs:
      bump:
        description: 'Version part to bump: patch, minor or major'
        type: string
        default: 'patch'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-play-store:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 60

    outputs:
      version: ${{ steps.version.outputs.name }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A token that may push the version commit to this branch.
          token: ${{ secrets.TOKEN }}

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Bump version
        id: version
        run: |
          ./gradlew --no-configuration-cache bumpVersion -Pbump=${{ inputs.bump || 'patch' }}
          name=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### Releasing $name to beta" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up environment
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > ./play_publish.json;
          echo "${{ secrets.SIGNING_PROPERTIES_FILE_BASE64 }}" | base64 -d > ./credentials.properties;
          echo "${{ secrets.SIGNING_KEYSTORE_FILE_BASE64 }}" | base64 -d > ./android_keystore.jks;

      - name: Deploy Play Store
        run: ./gradlew --no-configuration-cache publishReleaseBundle uploadCrashlyticsMappingFileRelease
        env:
          PLAYSTORE_TRACK: "beta"
          PLAYSTORE_RELEASE_STATUS: "completed"

      - name: Commit version
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Release ${{ steps.version.outputs.name }} [skip ci]"
          # Commits pushed while the upload ran would reject a plain push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create-tag:
    runs-on: ubuntu-latest
    needs: publish-play-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release Tag
        run: |
          gh release create ${{ needs.publish-play-store.outputs.version }} \
            --latest \
            --title "${{ needs.publish-play-store.outputs.version }}" \
            --target ${{ needs.publish-play-store.outputs.sha }}
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
